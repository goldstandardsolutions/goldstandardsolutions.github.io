name: Manual publish test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 2025.10)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test manifest
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p updates
          cat > updates/manifest.json <<EOF
          {
            "version": "${VERSION}",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "manual-dispatch test"
          }
          EOF

      - name: Commit manifest
        run: |
          git add updates/manifest.json
          git -c user.name="Gold Standard Solutions" -c user.email="goldstandardsoftware@gmail.com" commit -m "test manifest ${{ inputs.version }}" || true
          git push
