name: Sign manifest on release

permissions:
  contents: write

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional tag/version to sign (if dispatching manually)"
        required: false
      release_body:
        description: "Optional release notes/body (for manual dispatch)"
        required: false

jobs:
  sign_manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y openssl jq curl

      - name: Build private key file from secret
        env:
          EC_PRIVATE_PEM: ${{ secrets.EC_PRIVATE_PEM }}
        run: |
          if [ -z "$EC_PRIVATE_PEM" ]; then
            echo "EC_PRIVATE_PEM secret is not set. Failing."
            exit 1
          fi
          echo "$EC_PRIVATE_PEM" > ec_private.pem
          chmod 600 ec_private.pem

      - name: Determine release variables
        id: vars
        run: |
          # Try to read values from the event payload first (works for release events and manual dispatch)
          TAG=""
          RELEASED=""
          RELEASE_BODY=""
          if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
            TAG=$(jq -r '.release.tag_name // .inputs.version // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
            RELEASED=$(jq -r '.release.published_at // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
            RELEASE_BODY=$(jq -r '.release.body // .inputs.release_body // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          fi
          # fallback to inputs if jq didn't find them
          if [ -z "$TAG" ] && [ -n "${{ github.event.inputs.version || '' }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          # final fallback to ref name
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF##*/}"
          fi
          if [ -z "$RELEASED" ]; then
            RELEASED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          ASSET="towers-${TAG}.db"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "asset=$ASSET" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "released=$RELEASED" >> $GITHUB_OUTPUT
          # export the release body to a file for later use
          echo "$RELEASE_BODY" > release_body.txt || true

      - name: Download the release asset
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          ASSET="${{ steps.vars.outputs.asset }}"
          URL="${{ steps.vars.outputs.url }}"
          echo "Downloading asset from $URL"
          curl -L -f -o "$ASSET" "$URL"
          ls -lh "$ASSET"

      - name: Compute metadata and write manifest
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          ASSET="${{ steps.vars.outputs.asset }}"
          URL="${{ steps.vars.outputs.url }}"
          RELEASED="${{ steps.vars.outputs.released }}"
          # read release body generated above (may be empty)
          RELEASE_BODY="$(cat release_body.txt 2>/dev/null || true)"
          # compute size & sha
          SHA=$(shasum -a 256 "$ASSET" | awk '{print $1}')
          SIZE=$(stat -c%s "$ASSET" 2>/dev/null || stat -f%z "$ASSET")
          mkdir -p updates
          cat > updates/manifest.json <<EOF
{
  "version": "${TAG}",
  "releasedAt": "${RELEASED}",
  "minAppVersion": "1.0.0",
  "sizeBytes": ${SIZE},
  "sha256": "${SHA}",
  "url": "${URL}",
  "notes": "${RELEASE_BODY}",
  "signature": ""
}
EOF
          echo "Wrote updates/manifest.json (size $(wc -c < updates/manifest.json) bytes)"

      - name: Sign manifest (DER ECDSA P-256)
        run: |
          openssl dgst -sha256 -sign ec_private.pem -out updates/manifest.sig updates/manifest.json
          openssl base64 -in updates/manifest.sig -A -out updates/manifest.sig.b64
          echo "Signed manifest; produced updates/manifest.sig and updates/manifest.sig.b64"

      - name: Commit and push manifest + signature
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: publish manifest and signature for ${{ steps.vars.outputs.tag }}"
          file_pattern: |
            updates/manifest.json
            updates/manifest.sig
            updates/manifest.sig.b64
