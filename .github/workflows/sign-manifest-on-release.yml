name: Sign manifest on release
permissions: { contents: write }
on:
  release: { types: [created, published] }
  workflow_dispatch:
    inputs:
      version:
        description: "Tag/version to sign (e.g. 2025.10.11)"
        required: true
jobs:
  sign_manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y openssl jq curl

      - name: Configure git identity
        run: |
          git config user.name "Gold Standard Solutions"
          git config user.email "goldstandardsoftware@gmail.com"

      - name: Build private key from secret (base64-safe)
        env:
          EC_PRIVATE_PEM_B64: ${{ secrets.EC_PRIVATE_PEM_B64 }}
          EC_PRIVATE_PEM:     ${{ secrets.EC_PRIVATE_PEM }}
        run: |
          set -e
          if [ -n "$EC_PRIVATE_PEM_B64" ]; then
            echo "$EC_PRIVATE_PEM_B64" | base64 -d > ec_private.pem
          elif [ -n "$EC_PRIVATE_PEM" ]; then
            printf "%s" "$EC_PRIVATE_PEM" | sed 's/\\r//g; s/\\n/\n/g' > ec_private.pem
          else
            echo "No key in secrets (EC_PRIVATE_PEM_B64 or EC_PRIVATE_PEM)"; exit 1
          fi
          chmod 600 ec_private.pem
          openssl pkey -in ec_private.pem -noout >/dev/null

      - name: Determine tag/asset/url
        id: vars
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          ASSET="towers-${TAG}.db"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
          echo "tag=$TAG"     >> $GITHUB_OUTPUT
          echo "asset=$ASSET" >> $GITHUB_OUTPUT
          echo "url=$URL"     >> $GITHUB_OUTPUT

      - name: Download DB asset
        run: |
          curl -Lf -o "${{ steps.vars.outputs.asset }}" "${{ steps.vars.outputs.url }}"
          ls -lh "${{ steps.vars.outputs.asset }}"

      - name: Write manifest (first push)
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          URL="${{ steps.vars.outputs.url }}"
          SIZE=$(stat -c%s "towers-${TAG}.db" 2>/dev/null || stat -f%z "towers-${TAG}.db")
          SHA=$(shasum -a 256 "towers-${TAG}.db" | awk '{print $1}')
          mkdir -p updates
          jq -n --arg v "$TAG" --arg u "$URL" --arg s "$SHA" --argjson z "$SIZE" \
            '{version:$v,releasedAt:(now|todate),minAppVersion:"1.0.0",sizeBytes:$z,sha256:$s,url:$u,notes:"",signature:""}' > updates/manifest.json
          git add updates/manifest.json
          git commit -m "manifest for $TAG" || true
          git push

      - name: Fetch served manifest & sign it (second push)
        run: |
          for i in {1..12}; do
            curl -s -H 'Cache-Control:no-cache' https://goldstandardsolutions.github.io/updates/manifest.json -o /tmp/manifest.json
            [ -s /tmp/manifest.json ] && break
            sleep 5
          done
          openssl dgst -sha256 -sign ec_private.pem -out updates/manifest.sig /tmp/manifest.json
          openssl base64 -in updates/manifest.sig -A -out updates/manifest.sig.b64
          git add updates/manifest.sig updates/manifest.sig.b64
          git commit -m "sign manifest ${{ steps.vars.outputs.tag }}" || true
          git push
